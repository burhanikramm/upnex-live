<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2B3D70" />

    <title>Upnex Digital Agency | We Grow Brands Digitally</title>
    <meta
      name="description"
      content="Upnex Digital Agency is a premium digital marketing agency helping businesses dominate online through powerful websites, SEO, branding, social media marketing, paid advertising and AI automation."
    />
    <meta
      name="keywords"
      content="digital marketing agency, SEO, web design, social media marketing, Google Ads, Facebook Ads, branding, AI automation, Upnex, Upnex Digital Agency, Islamabad marketing agency"
    />
    <meta name="author" content="Upnex Digital Agency" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://upnexagency.com" />

    <!-- Google AdSense Script -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8379875594305550"
      crossorigin="anonymous"
    ></script>

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Upnex Digital Agency" />
    <meta property="og:url" content="https://upnexagency.com" />
    <meta property="og:title" content="Upnex Digital Agency | We Grow Brands Digitally" />
    <meta
      property="og:description"
      content="Premium digital marketing agency. We build digital experiences that grow businesses through SEO, web design, paid ads and AI automation."
    />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Upnex Digital Agency | We Grow Brands Digitally" />
    <meta
      name="twitter:description"
      content="Premium digital marketing agency. We build digital experiences that grow businesses."
    />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Fonts: preconnect early, then load a trimmed set of weights -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Warm the connection for the logo shown on the loading screen -->
    <link rel="preload" as="image" href="/logo-light.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MarketingAgency",
        "name": "Upnex Digital Agency",
        "alternateName": "Upnex",
        "description": "Premium digital marketing agency helping businesses grow digitally",
        "url": "https://upnexagency.com",
        "logo": "https://upnexagency.com/logo.png",
        "image": "https://upnexagency.com/logo.png",
        "foundingDate": "2022",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Office 4083, 4th Floor, Giga Mall",
          "addressLocality": "Islamabad",
          "addressCountry": "PK"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+92-331-3050461",
          "email": "hello@upnexagency.com",
          "contactType": "customer service",
          "availableLanguage": ["English", "Urdu"]
        },
        "sameAs": [
          "https://www.instagram.com/upnexagency",
          "https://www.tiktok.com/@upnexagency",
          "https://www.linkedin.com/in/upnexagency"
        ]
      }
    </script>

    <!-- Paint the brand background before React mounts to avoid a white flash -->
    <style>
      html,
      body {
        margin: 0;
        background-color: #070a14;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; color: #fff; font-family: sans-serif">
        Upnex Digital Agency — please enable JavaScript to view this site.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
